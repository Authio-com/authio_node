name: publish-platform-secrets

on:
  push:
    tags:
      - 'platform-secrets-v*'
  workflow_dispatch:

# Publishes @useauthio/platform-secrets from packages/platform-secrets.
# Tag example: platform-secrets-v0.1.0
#
# AUTH — npm Trusted Publishing (OIDC, tokenless). No NPM_TOKEN, no OTP.
# On npmjs.com the package must list this workflow as a Trusted Publisher
# (Settings → Trusted Publisher → GitHub Actions):
#   Organization/user: Authio-com
#   Repository:        authio_node
#   Workflow filename: publish-platform-secrets.yml
#   Environment:       (blank)
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          # 22 to match ci.yml; npm 12 refuses to install on 20.
          node-version: 22
          # Deliberately no registry-url: it writes an .npmrc holding
          # _authToken=${NODE_AUTH_TOKEN}, which with no token resolves
          # to an empty credential that npm sends instead of falling
          # back to OIDC.
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
        working-directory: packages/platform-secrets
      - name: Test
        run: pnpm test
        working-directory: packages/platform-secrets
      # OIDC trusted publishing needs npm >= 11.5.1 (pnpm publish does not
      # do the OIDC token exchange) and NO NODE_AUTH_TOKEN in the env. The
      # package has no workspace:* dependencies, so plain `npm publish` is
      # equivalent to `pnpm publish` here.
      - name: Publish to npm (OIDC trusted publishing)
        working-directory: packages/platform-secrets
        run: |
          npm install -g npm@latest
          npm --version
          if ! npm publish --provenance --access public; then
            echo "::error::npm publish was rejected. Confirm @useauthio/platform-secrets has a Trusted Publisher on npmjs.com: org Authio-com, repo authio_node, workflow publish-platform-secrets.yml, environment blank."
            exit 1
          fi
